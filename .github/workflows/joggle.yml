name: joggle

on:
  push:
    branches: [main, joggle]
  pull_request:

jobs:
  joggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Judgements are replayed from the committed cache, so this job needs no
      # API key. Deterministic rules still run; judged rules report as skipped
      # when a candidate has never been judged.
      - run: pnpm joggle check --offline --format github
